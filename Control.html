
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Arena | Event Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#f3f7ff;font-family:Arial,sans-serif}
header{padding:20px 6%;border-bottom:1px solid #24334a;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800}
.logo span{color:#39dcff}
main{max-width:1000px;margin:auto;padding:25px 16px}
.panel{background:#101725;border:1px solid #24334a;border-radius:13px;padding:22px;margin:18px 0}
h1{font-size:28px}
h2{font-size:20px;margin-top:0}
.muted{color:#9baac0;font-size:14px}
label{display:block;margin:12px 0 7px;font-size:14px}
input,select{width:100%;padding:13px;background:#080e19;border:1px solid #34445c;border-radius:7px;color:white;margin-bottom:10px}
button{padding:12px 16px;border:0;border-radius:7px;background:#39dcff;color:#06111c;font-weight:bold;margin:5px 5px 5px 0;cursor:pointer}
button.secondary{background:#26364d;color:white}
button.danger{background:#a93645;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.item{padding:14px;border:1px solid #34445c;border-radius:9px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row button{flex:0 0 auto}
#status{padding:12px 0;color:#39dcff;white-space:pre-wrap}
#loginStatus{color:#ffbd69;white-space:pre-wrap;min-height:22px;margin-top:12px}
#timer{font-size:42px;font-weight:800;color:#39dcff;margin:12px 0}
small{color:#9baac0}
@media(max-width:500px){
header{padding:16px}
main{padding:15px 12px}
.panel{padding:16px}
h1{font-size:24px}
#timer{font-size:36px}
}
</style>
</head>

<body>

<header>
<div class="logo">PROMPT<span>ARENA</span> CONTROL</div>
<button id="logout" class="hidden" type="button">LOGOUT</button>
</header>

<main>

<section id="loginPanel" class="panel">
<h1>Admin Login</h1>
<p class="muted">Authorized leaders only.</p>

<label>Email</label>
<input id="email" type="email" autocomplete="username" placeholder="Enter admin email">

<label>Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Enter password">

<button id="loginButton" type="button" onclick="handleAdminLogin()">LOGIN</button>

<div id="loginStatus" role="status"></div>
</section>

<section id="dashboard" class="hidden">

<h1>Event Control Center</h1>
<p class="muted">Create batches, manage rounds and control the live event.</p>

<div class="panel">
<h2>Batch Management</h2>

<label>Batch name</label>
<input id="batchName" placeholder="Example: Batch 1">

<button id="createBatch" type="button">CREATE BATCH</button>

<div id="batchList"></div>
</div>

<div class="panel">
<h2>Round Management</h2>

<label>Select batch</label>
<select id="roundBatch"></select>

<label>Round name</label>
<input id="roundName" placeholder="Example: Round 1">

<label>Duration (minutes)</label>
<input id="roundDuration" type="number" min="1" value="5">

<button id="createRound" type="button">ADD ROUND</button>

<div id="roundList"></div>
</div>

<div class="panel">
<h2>Live Event Control</h2>

<label>Active batch</label>
<select id="activeBatch"></select>

<label>Current round</label>
<select id="activeRound"></select>

<div id="eventStatus" class="muted">Loading event status...</div>
<div id="timer">00:00</div>

<div class="row">
<button id="startEvent" type="button">START / RESTART</button>
<button id="pauseEvent" class="secondary" type="button">PAUSE</button>
<button id="resumeEvent" class="secondary" type="button">RESUME</button>
<button id="stopEvent" class="danger" type="button">STOP</button>
</div>

<p class="muted">
START / RESTART resets the selected round to its full duration.
</p>
</div>

<div id="status" role="status"></div>

</section>
</main>

<script>
"use strict";

/* SUPABASE SETTINGS */

const SUPABASE_URL = "https://oskeorlpcpwixogngplx.supabase.co";
const SUPABASE_KEY = "sb_publishable_KwzJMVsjO5Pde4GuG0-3Rg_TkFQ-Dn0";
const ADMIN_UID = "26ca7369-2f27-43e2-896a-0b78aef573f3";

const $ = id => document.getElementById(id);

let db = null;
let batches = [];
let rounds = [];
let control = null;
let finishing = false;

/* MESSAGES */

function message(text){
$("status").textContent = text;
}

function loginMessage(text){
$("loginStatus").textContent = text;
}

/* SHOW / HIDE */

function showDashboard(){
$("loginPanel").classList.add("hidden");
$("dashboard").classList.remove("hidden");
$("logout").classList.remove("hidden");
}

function showLogin(){
$("dashboard").classList.add("hidden");
$("loginPanel").classList.remove("hidden");
$("logout").classList.add("hidden");
}

/* LOGIN */

window.handleAdminLogin = async function(){

const button = $("loginButton");
const email = $("email").value.trim();
const password = $("password").value;

if(!email || !password){
loginMessage("Please enter both email and password.");
return;
}

if(!db){
loginMessage("Supabase is not loaded.");
return;
}

button.disabled = true;
loginMessage("Checking login...");

try{

const {data,error} = await db.auth.signInWithPassword({
email,
password
});

if(error) throw error;

if(!data.user || data.user.id !== ADMIN_UID){

await db.auth.signOut();
throw new Error("Access denied. Admin account only.");

}

showDashboard();
loginMessage("Login successful!");

await refreshAll();

}catch(error){

loginMessage("LOGIN ERROR: " + error.message);

}finally{

button.disabled = false;

}

};

/* EVENT CONTROL INITIALIZATION */

/*
One control record is maintained per batch.
Never create a control record without batch_id.
*/

async function ensureControl(batchId){

if(!batchId){
control = null;
return;
}

const {data,error} = await db
.from("event_control")
.select("*")
.eq("batch_id",batchId)
.maybeSingle();

if(error) throw error;

if(data){
control = data;
return;
}

const {data:created,error:createError} = await db
.from("event_control")
.insert({
batch_id:batchId,
event_status:"stopped",
remaining_seconds:0
})
.select()
.single();

if(createError) throw createError;

control = created;

}

/* LOAD BATCHES */

async function loadBatches(preferredBatchId){

const {data,error} = await db
.from("event_batches")
.select("*")
.order("created_at",{ascending:true});

if(error) throw error;

batches = data || [];

$("batchList").replaceChildren();
$("roundBatch").replaceChildren();
$("activeBatch").replaceChildren();

if(batches.length === 0){

$("batchList").textContent = "No batches created yet.";

$("roundList").textContent = "Create a batch first.";

$("activeRound").replaceChildren();

rounds = [];
control = null;

return;

}

batches.forEach(batch=>{

const displayName =
batch.batch_name + " (" + batch.id.slice(0,4) + ")";

$("roundBatch").add(new Option(displayName,batch.id));
$("activeBatch").add(new Option(displayName,batch.id));

const item = document.createElement("div");
item.className = "item";

const title = document.createElement("strong");
title.textContent = batch.batch_name;

const shortId = document.createElement("small");
shortId.textContent = " · ID: " + batch.id.slice(0,8);

const edit = document.createElement("button");
edit.textContent = "EDIT";
edit.className = "secondary";
edit.type = "button";
edit.onclick = ()=>editBatch(batch);

const del = document.createElement("button");
del.textContent = "DELETE";
del.className = "danger";
del.type = "button";
del.onclick = ()=>deleteBatch(batch);

item.append(title,shortId,edit,del);
$("batchList").append(item);

});

const selected =
batches.find(b=>b.id === preferredBatchId) ||
batches.find(b=>b.id === $("activeBatch").value) ||
batches[0];

$("activeBatch").value = selected.id;
$("roundBatch").value = selected.id;

}

/* EDIT BATCH */

async function editBatch(batch){

const name = prompt("Enter new batch name:",batch.batch_name);

if(name === null) return;

if(!name.trim()){
return alert("Batch name cannot be empty.");
}

try{

const {error} = await db
.from("event_batches")
.update({batch_name:name.trim()})
.eq("id",batch.id);

if(error) throw error;

message("Batch updated.");
await refreshAll(batch.id);

}catch(error){

message("EDIT ERROR: " + error.message);

}

}

/* DELETE BATCH */

async function deleteBatch(batch){

if(
control?.batch_id === batch.id &&
["running","paused"].includes(control.event_status)
){
return alert("Stop the event before deleting its active batch.");
}

if(!confirm(
"Delete " + batch.batch_name +
"? Its associated rounds and event control will also be deleted."
)) return;

try{

const {error} = await db
.from("event_batches")
.delete()
.eq("id",batch.id);

if(error) throw error;

control = null;
rounds = [];

message("Batch deleted successfully.");

await refreshAll();

}catch(error){

message("Could not delete batch: " + error.message);

}

}

/* LOAD ROUNDS */

async function loadRounds(){

const batchId = $("roundBatch").value;

$("roundList").replaceChildren();
$("activeRound").replaceChildren();

rounds = [];

if(!batchId){
$("roundList").textContent = "Create a batch first.";
return;
}

const {data,error} = await db
.from("event_rounds")
.select("*")
.eq("batch_id",batchId)
.order("round_order",{ascending:true});

if(error) throw error;

rounds = data || [];

if(rounds.length === 0){
$("roundList").textContent = "No rounds in this batch.";
}

rounds.forEach(round=>{

$("activeRound").add(
new Option(round.round_name,round.id)
);

const item = document.createElement("div");
item.className = "item";

const title = document.createElement("strong");
title.textContent =
round.round_order + ". " + round.round_name;

const duration = document.createElement("small");
duration.textContent =
" · " + Math.floor(round.duration_seconds/60) + " min";

const edit = document.createElement("button");
edit.textContent = "EDIT";
edit.className = "secondary";
edit.type = "button";
edit.onclick = ()=>editRound(round);

const del = document.createElement("button");
del.textContent = "DELETE";
del.className = "danger";
del.type = "button";
del.onclick = ()=>deleteRound(round);

item.append(title,duration,edit,del);
$("roundList").append(item);

});

if(
control?.current_round_id &&
control.batch_id === batchId
){
$("activeRound").value = control.current_round_id;
}

}

/* EDIT ROUND */

async function editRound(round){

if(
control?.current_round_id === round.id &&
["running","paused"].includes(control.event_status)
){
return alert("Stop this round before editing it.");
}

const name = prompt("Round name:",round.round_name);

if(name === null) return;

if(!name.trim()){
return alert("Round name cannot be empty.");
}

const mins = prompt(
"Duration in minutes:",
round.duration_seconds/60
);

if(mins === null) return;

const seconds = Math.floor(Number(mins)*60);

if(!Number.isFinite(seconds) || seconds <= 0){
return alert("Invalid duration.");
}

try{

const {error} = await db
.from("event_rounds")
.update({
round_name:name.trim(),
duration_seconds:seconds
})
.eq("id",round.id);

if(error) throw error;

message("Round updated.");

await loadRounds();

}catch(error){

message("ROUND ERROR: " + error.message);

}

}

/* DELETE ROUND */

async function deleteRound(round){

if(
control?.current_round_id === round.id &&
["running","paused"].includes(control.event_status)
){
return alert("Stop this round before deleting it.");
}

if(!confirm("Delete " + round.round_name + "?")) return;

try{

const {error} = await db
.from("event_rounds")
.delete()
.eq("id",round.id);

if(error) throw error;

message("Round deleted.");

await refreshAll(control?.batch_id);

}catch(error){

message("Could not delete round: " + error.message);

}

}

/* CREATE BATCH */

$("createBatch").onclick = async ()=>{

const button = $("createBatch");
const name = $("batchName").value.trim();

if(!name){
return message("Enter a batch name.");
}

button.disabled = true;
message("Creating batch...");

try{

const {data,error} = await db
.from("event_batches")
.insert({batch_name:name})
.select()
.single();

if(error) throw error;

$("batchName").value = "";

/* Select and initialize the newly created batch */
await refreshAll(data.id);

message("Batch created and event control initialized.");

}catch(error){

message("BATCH ERROR: " + error.message);

}finally{

button.disabled = false;

}

};

/* CREATE ROUND */

$("roundBatch").onchange = async ()=>{

try{

await loadRounds();

}catch(error){

message("ROUND LOAD ERROR: " + error.message);

}

};

$("createRound").onclick = async ()=>{

const button = $("createRound");

const batchId = $("roundBatch").value;
const name = $("roundName").value.trim();
const minutes = Number($("roundDuration").value);

if(!batchId) return message("Create/select a batch first.");
if(!name) return message("Enter a round name.");

if(!Number.isFinite(minutes) || minutes <= 0){
return message("Enter a valid duration.");
}

const order = rounds.length
? Math.max(...rounds.map(r=>r.round_order))+1
: 1;

button.disabled = true;

try{

const {error} = await db
.from("event_rounds")
.insert({
batch_id:batchId,
round_name:name,
round_order:order,
duration_seconds:Math.floor(minutes*60)
});

if(error) throw error;

$("roundName").value = "";

await loadRounds();

message("Round created successfully.");

}catch(error){

message("ROUND ERROR: " + error.message);

}finally{

button.disabled = false;

}

};

/* ACTIVE BATCH CHANGE */

$("activeBatch").onchange = async ()=>{

const batchId = $("activeBatch").value;

try{

$("roundBatch").value = batchId;

await ensureControl(batchId);
await loadRounds();

renderControl();

message("Active batch changed successfully.");

}catch(error){

message("EVENT CONTROL ERROR: " + error.message);

}

};

/* SAVE CONTROL */

async function saveControl(values){

if(!control?.id){
throw new Error("Event control record not found. Select a batch first.");
}

const {data,error} = await db
.from("event_control")
.update({
...values,
updated_at:new Date().toISOString()
})
.eq("id",control.id)
.select()
.single();

if(error) throw error;

control = data;

renderControl();

}

/* RENDER STATUS */

function renderControl(){

if(!control){

$("eventStatus").textContent = batches.length
? "Select a batch to initialize event control."
: "Create your first batch to begin.";

$("timer").textContent = "00:00";

return;

}

$("eventStatus").textContent =
"Event status: " +
(control.event_status || "stopped").toUpperCase();

if(control.batch_id){
$("activeBatch").value = control.batch_id;
$("roundBatch").value = control.batch_id;
}

if(control.current_round_id){
$("activeRound").value = control.current_round_id;
}

updateTimer();

}

/* TIMER */

function updateTimer(){

if(!control) return;

let remaining = Number(control.remaining_seconds || 0);

if(
control.event_status === "running" &&
control.deadline_at
){

remaining = Math.max(
0,
Math.ceil(
(new Date(control.deadline_at).getTime()-Date.now())/1000
)
);

if(remaining === 0){

$("timer").textContent = "00:00";
finishRound();
return;

}

}

const mins = Math.floor(remaining/60);
const secs = remaining%60;

$("timer").textContent =
String(mins).padStart(2,"0") + ":" +
String(secs).padStart(2,"0");

}

/* FINISH ROUND */

async function finishRound(){

if(
!control ||
control.event_status !== "running" ||
finishing
) return;

finishing = true;

try{

await saveControl({
event_status:"completed",
remaining_seconds:0,
deadline_at:null
});

message("Round time over.");

}catch(error){

message("FINISH ERROR: " + error.message);

}finally{

finishing = false;

}

}

/* START / RESTART */

$("startEvent").onclick = async ()=>{

const batchId = $("activeBatch").value;
const roundId = $("activeRound").value;

if(!batchId || !roundId){
return message("Select a batch and round.");
}

if($("roundBatch").value !== batchId){
return message(
"Select the same batch in Round Management and Active Batch."
);
}

const round = rounds.find(r=>r.id === roundId);

if(!round){
return message("Round details not loaded. Select the batch again.");
}

if(!confirm(
"Start/restart this round from its full duration?"
)){
return;
}

try{

/* Ensure the correct batch control is loaded */
if(control?.batch_id !== batchId){
await ensureControl(batchId);
}

const now = new Date();

const deadline = new Date(
now.getTime() + round.duration_seconds*1000
);

await saveControl({
batch_id:batchId,
current_round_id:roundId,
event_status:"running",
started_at:now.toISOString(),
deadline_at:deadline.toISOString(),
remaining_seconds:round.duration_seconds
});

message("Event started. Timer reset to full duration.");

}catch(error){

message("START ERROR: " + error.message);

}

};

/* PAUSE */

$("pauseEvent").onclick = async ()=>{

if(control?.event_status !== "running"){
return message("Event is not running.");
}

const remaining = Math.max(
0,
Math.ceil(
(new Date(control.deadline_at).getTime()-Date.now())/1000
)
);

try{

await saveControl({
event_status:"paused",
remaining_seconds:remaining,
deadline_at:null
});

message("Event paused.");

}catch(error){

message("PAUSE ERROR: " + error.message);

}

};

/* RESUME */

$("resumeEvent").onclick = async ()=>{

if(control?.event_status !== "paused"){
return message("Event is not paused.");
}

const remaining = Number(control.remaining_seconds || 0);

if(remaining <= 0){
return message("Time is over. Restart the round.");
}

const deadline = new Date(
Date.now()+remaining*1000
);

try{

await saveControl({
event_status:"running",
deadline_at:deadline.toISOString()
});

message("Event resumed.");

}catch(error){

message("RESUME ERROR: " + error.message);

}

};

/* STOP */

$("stopEvent").onclick = async ()=>{

if(!control){
return message("Select a batch first.");
}

if(!confirm(
"Stop the event now? A future START will reset the timer."
)){
return;
}

try{

await saveControl({
event_status:"stopped",
deadline_at:null,
remaining_seconds:0
});

message("Event stopped. Next start will use full round duration.");

}catch(error){

message("STOP ERROR: " + error.message);

}

};

/* REFRESH ALL */

async function refreshAll(preferredBatchId){

try{

await loadBatches(preferredBatchId);

if(batches.length === 0){

control = null;
rounds = [];

$("activeRound").replaceChildren();
$("roundList").textContent = "Create a batch first.";

renderControl();

message("No batches available. Create your first batch.");

return;

}

const batchId = $("activeBatch").value;

await ensureControl(batchId);

await loadRounds();

renderControl();

message("Batches loaded: " + batches.length);

}catch(error){

message(
"DASHBOARD ERROR: " + error.message
);

$("eventStatus").textContent =
"Event control error: " + error.message;

}

}

/* SESSION CHECK */

async function checkSession(){

if(!db){
loginMessage("Supabase library not loaded. Check internet connection.");
return;
}

try{

const {data,error} = await db.auth.getSession();

if(error) throw error;

const user = data.session?.user;

if(user?.id === ADMIN_UID){

showDashboard();
await refreshAll();

}else{

if(user) await db.auth.signOut();

showLogin();

}

}catch(error){

loginMessage("SESSION ERROR: " + error.message);

}

}

/* LOGOUT */

$("logout").onclick = async ()=>{

try{

await db.auth.signOut();

}catch(error){

console.error(error);

}

location.reload();

};

/* INITIALIZE */

try{

if(
!window.supabase ||
!window.supabase.createClient
){
throw new Error("Supabase library failed to load.");
}

db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

checkSession();

}catch(error){

loginMessage("STARTUP ERROR: " + error.message);

}

/* TIMER REFRESH */

setInterval(()=>{

if(control?.event_status === "running"){
updateTimer();
}

},500);

</script>
</body>
</html>
